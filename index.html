<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyszukiwarka szkol i przedszkoli</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <header class="sidebar__header">
      <h1>Szkoly &amp; przedszkola</h1>
      <p class="sidebar__subtitle">Ranking miast w powiecie wg liczby placowek w promieniu.</p>
    </header>

    <form id="search-form" class="search-form" autocomplete="off">
      <label class="field">
        <span>Powiat</span>
        <input
          type="text"
          id="powiat-input"
          name="powiat"
          placeholder="np. krakowski"
          list="powiat-list"
          required
        />
        <datalist id="powiat-list"></datalist>
      </label>

      <label class="field">
        <span>Promien (km)</span>
        <input
          type="number"
          id="radius-input"
          name="radius"
          value="5"
          min="0.5"
          step="0.5"
          required
        />
      </label>

      <div class="form-row">
        <button type="submit">Szukaj</button>
        <button type="button" id="csv-import-btn" class="btn-secondary" title="Wklej CSV z RSPO dla szybszego i pelniejszego wyniku">
          + wklej CSV
        </button>
      </div>
    </form>

    <!-- Modal: wklej CSV z RSPO dla wybranego powiatu -->
    <div id="csv-modal" class="csv-modal" hidden>
      <div class="csv-modal__box">
        <div class="csv-modal__header">
          <strong>Wklej CSV z RSPO</strong>
          <button type="button" id="csv-modal-close" class="csv-modal__close" title="Zamknij">&times;</button>
        </div>
        <p class="csv-modal__hint">
          Pobierz CSV ze strony
          <a href="https://rspo.gov.pl/zaawansowana" target="_blank" rel="noopener">rspo.gov.pl/zaawansowana</a>
          (filtr: Szkola podstawowa + Przedszkole, wybrany powiat), a nastepnie wklej calą zawartosc pliku ponizej.
        </p>
        <textarea
          id="csv-textarea"
          class="csv-modal__textarea"
          placeholder="Wklej tutaj zawartosc pliku CSV (separatorem jest srednik ;)..."
          spellcheck="false"
        ></textarea>
        <div id="csv-parse-status" class="csv-modal__parse-status"></div>
        <div class="csv-modal__actions">
          <button type="button" id="csv-load-btn" class="csv-modal__load-btn">Zaladuj dane</button>
          <button type="button" id="csv-cancel-btn" class="csv-modal__cancel-btn">Anuluj</button>
        </div>
      </div>
    </div>

    <div id="status" class="status">Ladowanie danych...</div>

    <section id="results" class="results" aria-live="polite"></section>

    <footer class="sidebar__footer">
      <small>
        Dane: <a href="https://rspo.gov.pl" target="_blank" rel="noopener">RSPO</a> /
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.
        <button
          id="clear-cache-btn"
          type="button"
          title="Wyczyść pamięć podręczną Overpass (odświeży dane)"
          style="
            margin-left:6px;background:none;border:none;color:#7b8794;
            cursor:pointer;font-size:11px;padding:0;text-decoration:underline;
          "
          onclick="var n=Overpass.clearCache();alert('Wyczyszczono '+n+' wpisów cache. Dane zostaną pobrane ponownie przy następnym wyszukiwaniu.');"
        >wyczyść cache</button>
      </small>
    </footer>
  </aside>

  <main id="map" class="map"></main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/overpass.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
