<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyszukiwarka szkol i przedszkoli</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <header class="sidebar__header">
      <h1>Szkoly &amp; przedszkola</h1>
      <p class="sidebar__subtitle">Ranking miast w powiecie wg liczby placowek w promieniu.</p>
    </header>

    <form id="search-form" class="search-form" autocomplete="off">
      <label class="field">
        <span>Powiat</span>
        <input
          type="text"
          id="powiat-input"
          name="powiat"
          placeholder="np. krakowski"
          list="powiat-list"
          required
        />
        <datalist id="powiat-list"></datalist>
      </label>

      <label class="field">
        <span>Promien (km)</span>
        <input
          type="number"
          id="radius-input"
          name="radius"
          value="5"
          min="0.5"
          step="0.5"
          required
        />
      </label>

      <button type="submit">Szukaj</button>
    </form>

    <div id="status" class="status"></div>

    <section id="results" class="results" aria-live="polite"></section>

    <footer class="sidebar__footer">
      <small>
        Dane: <a href="https://rspo.gov.pl" target="_blank" rel="noopener">RSPO</a>.
        Mapa: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.
      </small>
    </footer>
  </aside>

  <main id="map" class="map"></main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
